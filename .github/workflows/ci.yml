name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          # Prefer minimal CPU stack; fall back to requirements.txt if needed
          if [ -f requirements-minimal.txt ]; then
            pip install -r requirements-minimal.txt
          else
            pip install -r requirements.txt
          fi
          # Ensure transformers tokenizer stack for EchoTokenizer
          pip install "transformers>=4.30.0,<5" Pillow PyYAML tqdm numpy opencv-python-headless
          # Torch CPU wheel (pin loosely for CI)
          pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Unit tests
        env:
          ECHOCLIP_SKIP_HUB: "1"
        run: python -m unittest discover -s tests -v

      - name: Validate (skip eval)
        env:
          ECHOCLIP_SKIP_HUB: "1"
        run: python scripts/validate.py --skip-eval
